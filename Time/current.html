<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time</title>
</head>
<body>
    <h2 id = "hanler-status">What Time is it?</h2>
    <button onclick="SeeTime()">See Time</button>
    <script>
        function SeeTime(){
            const hander=document.getElementById("hanler-status");
            hander.innerText = Date();
        }
    </script>
</body>
</html>
