<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Current Time</title>     
</head>
<body>
    <button id="currenttime">Time</button>
    <script>
        const ctime=document.getElementById('currenttime');
        ctime.onclick=cutime;
        function cutime(){
            ctime.innerHTML=Date();
        }
    </script>
</body>
</html>
