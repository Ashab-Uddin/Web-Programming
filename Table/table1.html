    <style>
        table,th,td{
            border: 1px solid black;
            border-collapse: collapse;
        }
    </style>
    <title>Table1</title>
</head>
<body>

            <td>Microsoft</td>

        </tr>
        <tr> 
            <td>Google</td>

        </tr>
        <tr>
            <td>Open AI</td>

        </tr>
    </table>

</html>
