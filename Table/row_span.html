<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        table,th,td{
            border: 1px solid black;
            border-collapse: collapse;
        }
    </style>
    <title>Table Rowspan</title>
</head>
<body>
    <table>
        <tr>
            <th>name</th>
            <td>Jill</td>
        </tr>
        <tr>
            <th rowspan="2">Phone</th>
            <td>0181234444</td>
        </tr>
        <tr>
            <td>015454544</td>
        </tr>
    </table>
</body>
</html>
