<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        table,td{
            border: 1px solid black;
            border-collapse: collapse;
        }
    </style>
    <title>Tableu</title>
</head>
<body>
    <table >
        <tr>
            <td colspan="3">A</td>
        </tr>
        <tr>
            <td>B</td>
            <td>C</td>
            <td rowspan="2">D</td>
        </tr>
        <tr>
            <td>E</td>
            <td>F</td>
        </tr>
    </table>
</body>
</html>
